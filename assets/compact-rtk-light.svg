<svg xmlns="http://www.w3.org/2000/svg" width="690" height="76" viewBox="0 0 690 76" role="img" aria-labelledby="title desc"><title id="title">RTK · output savings</title><desc id="desc">RTK reports approximately 29,169,706 command-output tokens saved, 48.8% output reduction across 14,669 commands. Local all-time estimate, not billing savings.</desc><text x="0" y="28" fill="#70549c" font-size="28" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="600">29.17M</text><text x="0" y="47" fill="#686171" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">estimated tokens saved</text><text x="315" y="28" fill="#302a3b" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">48.8%</text><text x="315" y="47" fill="#686171" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">less command output</text><text x="523" y="28" fill="#302a3b" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">14,669</text><text x="523" y="47" fill="#686171" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">commands</text><text x="0" y="65" fill="#686171" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">Local estimate · not billing savings · Updated 2026-10-28</text></svg>