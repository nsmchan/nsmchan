<svg xmlns="http://www.w3.org/2000/svg" width="690" height="100" viewBox="0 0 690 100" role="img" aria-labelledby="title desc"><title id="title">Serena · reference</title><desc id="desc">Serena reference compares 7 current full files, counted once per file, with 9 distinct logged symbol responses including JSON metadata. Only responses whose bodies match current files are included. Character difference divided by four: 8510 estimated tokens. Not actual savings, billing savings, or a claim that whole-file reads would have occurred.</desc><rect x="0.5" y="0.5" width="689" height="99" rx="10" fill="#f6fbf8" stroke="#cfe3d8" /><text x="27" y="43" fill="#332547" font-size="24" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">8.51K</text><text x="27" y="64" fill="#6b5c82" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">estimated difference</text><text x="342" y="43" fill="#332547" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">65.7%</text><text x="342" y="64" fill="#6b5c82" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">less than full files</text><text x="27" y="86" fill="#6b5c82" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">7 files · 9 symbol responses · reference only</text></svg>