<svg xmlns="http://www.w3.org/2000/svg" width="690" height="101" viewBox="0 0 690 101" role="img" aria-labelledby="title desc"><title id="title">RTK · output savings</title><desc id="desc">RTK reports approximately 27,916,955 command-output tokens saved, 47.3% output reduction across 14,012 commands. Local all-time estimate, not billing savings.</desc><text x="27" y="43" fill="#81c6ad" font-size="28" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="600">27.92M</text><text x="27" y="64" fill="#9198a1" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">estimated tokens saved</text><text x="342" y="43" fill="#e6edf3" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">47.3%</text><text x="342" y="64" fill="#9198a1" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">less command output</text><text x="550" y="43" fill="#e6edf3" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">14,012</text><text x="550" y="64" fill="#9198a1" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">commands</text><text x="27" y="86" fill="#9198a1" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">Local estimate · not billing savings · Updated 2026-10-26</text></svg>