<svg xmlns="http://www.w3.org/2000/svg" width="690" height="322" viewBox="0 0 690 322" role="img" aria-labelledby="title desc"><title id="title">Context efficiency</title><desc id="desc">RTK reports approximately 27,760,684 command-output tokens saved, 47.2% output reduction across 13,968 commands. Local all-time estimates, not billing savings. Serena reference compares 7 current full files, counted once per file, with 9 distinct logged symbol responses including JSON metadata. Only responses whose bodies match current files are included. Character difference divided by four: 8510 estimated tokens. Not actual savings, billing savings, or a claim that whole-file reads would have occurred. RTK and Serena values are not added together.</desc><rect x="0.5" y="0.5" width="689" height="321" rx="10" fill="#101d19" stroke="#30483c" /><rect x="1" y="1" width="688" height="5" rx="3" fill="#81c6ad" /><text x="27" y="37" fill="#baadd0" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">NSMCHAN / CONTEXT EFFICIENCY</text><text x="27" y="77" fill="#eee8f6" font-size="28" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">27.76M</text><text x="27" y="100" fill="#baadd0" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">estimated tokens saved · RTK</text><text x="342" y="74" fill="#eee8f6" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">47.2%</text><text x="342" y="100" fill="#baadd0" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">less command output</text><text x="550" y="74" fill="#eee8f6" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">13,968</text><text x="550" y="100" fill="#baadd0" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">commands</text><text x="27" y="134" fill="#baadd0" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">Before 58.82M → after 31.06M output tokens</text><line x1="27" y1="153" x2="663" y2="153" stroke="#30483c" /><text x="27" y="181" fill="#eee8f6" font-size="14" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">Serena · full-file reference</text><text x="27" y="215" fill="#eee8f6" font-size="24" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">8.51K</text><text x="27" y="237" fill="#baadd0" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">estimated context difference</text><text x="342" y="215" fill="#eee8f6" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">65.7%</text><text x="342" y="237" fill="#baadd0" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">less than full-file baseline</text><text x="27" y="263" fill="#baadd0" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">7 matched files · 9 unique symbol responses · chars / 4</text><text x="27" y="283" fill="#baadd0" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">Current matching files only · not measured savings</text><text x="27" y="301" fill="#baadd0" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="40