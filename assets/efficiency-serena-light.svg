<svg xmlns="http://www.w3.org/2000/svg" width="690" height="100" viewBox="0 0 690 100" role="img" aria-labelledby="title desc"><title id="title">Serena · reference</title><desc id="desc">Serena reference compares 7 current full files, counted once per file, with 9 distinct logged symbol responses including JSON metadata. Only responses whose bodies match current files are included. Character difference divided by four: 8510 estimated tokens. Not actual savings, billing savings, or a claim that whole-file reads would have occurred.</desc><text x="0" y="43" fill="#70549c" font-size="28" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="600">8.51K</text><text x="0" y="64" fill="#686171" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">estimated difference</text><text x="315" y="43" fill="#302a3b" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">65.7%</text><text x="315" y="64" fill="#686171" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">less than full files</text><text x="0" y="86" fill="#686171" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">7 files · 9 symbol responses · reference only</text></svg>