<svg xmlns="http://www.w3.org/2000/svg" width="690" height="45" viewBox="0 0 690 45" role="img" aria-labelledby="title desc"><title id="title">Caveman</title><desc id="desc">Caveman is a concise response skill used in this chat. No normal-answer baseline exists, and an A/B comparison would use extra tokens; savings are not measured.</desc><text x="0" y="19" fill="#686171" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400" class="tool-muted">Savings unmeasured</text><text x="0" y="37" fill="#686171" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400" class="tool-muted">No regular-answer baseline · A/B needs extra tokens</text><style id="tool-theme">@media (prefers-color-scheme: light){.tool-ink{fill:#302a3b;}.tool-muted{fill:#686171;}.tool-accent{fill:#70549c;}.tool-heading{fill:#514264;}}@media (prefers-color-scheme: dark){.tool-ink{fill:#f0f6fc;}.tool-muted{fill:#c2ccd8;}.tool-accent{fill:#c4a4f4;}.tool-heading{fill:#eadbff;}}</style></svg>