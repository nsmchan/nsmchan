<svg xmlns="http://www.w3.org/2000/svg" width="690" height="240" viewBox="0 0 690 240" role="img" aria-labelledby="title desc"><title id="title">Context efficiency</title><desc id="desc">RTK reports approximately 27,822,728 command-output tokens saved, 47.3% output reduction across 13,964 commands. Local all-time estimates, not billing savings. Serena savings are not measured.</desc><rect x="0.5" y="0.5" width="689" height="239" rx="10" fill="#f6fbf8" stroke="#cfe3d8" /><rect x="1" y="1" width="688" height="5" rx="3" fill="#30745c" /><text x="27" y="37" fill="#6b5c82" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">NSMCHAN / CONTEXT EFFICIENCY</text><text x="27" y="77" fill="#332547" font-size="28" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">27.82M</text><text x="27" y="100" fill="#6b5c82" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">estimated tokens saved · RTK</text><text x="342" y="74" fill="#332547" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">47.3%</text><text x="342" y="100" fill="#6b5c82" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">less command output</text><text x="550" y="74" fill="#332547" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">13,964</text><text x="550" y="100" fill="#6b5c82" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">commands</text><text x="27" y="134" fill="#6b5c82" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">Before 58.88M → after 31.06M output tokens</text><line x1="27" y1="153" x2="663" y2="153" stroke="#cfe3d8" /><text x="27" y="181" fill="#332547" font-size="14" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">Serena</text><text x="105" y="181" fill="#6b5c82" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">symbol-aware code tools</text><text x="663" y="181" fill="#6b5c82" font-size="12" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">Savings not measured</text><text x="27" y="219" fill="#6b5c82" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">RTK local all-time estimates · not billing savings · Updated 2026-10-26</text></svg>