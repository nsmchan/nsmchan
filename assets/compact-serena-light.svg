<svg xmlns="http://www.w3.org/2000/svg" width="690" height="76" viewBox="0 0 690 76" role="img" aria-labelledby="title desc"><title id="title">Serena · reference</title><desc id="desc">Cumulative reference from 18 files and 19 retained file-version samples. 24 distinct symbol responses matched source bodies when collected. Each file-version sample is frozen on first collection; previously recorded responses are not counted again. Edits and deletion do not remove saved samples. Character difference divided by four: 222472 estimated tokens. Not actual savings or billing savings. New samples can change the net difference and percentage.</desc><text x="0" y="28" fill="#70549c" font-size="28" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="600" class="tool-accent">222.47K</text><text x="0" y="47" fill="#686171" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400" class="tool-muted">cumulative reference</text><text x="315" y="28" fill="#302a3b" font-size="23" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500" class="tool-ink">96.5%</text><text x="315" y="47" fill="#686171" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400" class="tool-muted">less than full files</text><text x="0" y="65" fill="#686171" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400" class="tool-muted">18 files · 19 versions · 24 responses · reference only</text><style id="tool-theme">@media (prefers-color-scheme: light){.tool-ink{fill:#302a3b;}.tool-muted{fill:#686171;}.tool-accent{fill:#70549c;}.tool-heading{fill:#514264;}}@media (prefers-color-scheme: dark){.tool-ink{fill:#f0f6fc;}.tool-muted{fill:#c2ccd8;}.tool-accent{fill:#c4a4f4;}.tool-heading{fill:#eadbff;}}</style></svg>