<svg xmlns="http://www.w3.org/2000/svg" width="690" height="69" viewBox="0 0 690 69" role="img" aria-labelledby="title desc"><title id="title">Caveman</title><desc id="desc">Caveman is a concise response skill used in this chat. No normal-answer baseline exists, and an A/B comparison would use extra tokens; savings are not measured.</desc><rect x="0.5" y="0.5" width="689" height="68" rx="10" fill="#101d19" stroke="#30483c" /><text x="27" y="27" fill="#baadd0" font-size="12" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">Savings unmeasured</text><text x="27" y="52" fill="#baadd0" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">No regular-answer baseline · A/B needs extra tokens</text></svg>