<svg xmlns="http://www.w3.org/2000/svg" width="690" height="90" viewBox="0 0 690 90" role="img" aria-labelledby="title desc"><title id="title">Caveman</title><desc id="desc">Caveman is a concise response skill used in this chat. No normal-answer baseline exists, and an A/B comparison would use extra tokens; savings are not measured.</desc><rect x="0.5" y="0.5" width="689" height="89" rx="10" fill="#101d19" stroke="#30483c" /><image x="27" y="17" width="26" height="26" href="data:image/png;base64," data-tool="caveman" aria-label="caveman logo" /><text x="63" y="38" fill="#eee8f6" font-size="14" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="500">Caveman</text><text x="663" y="38" fill="#baadd0" font-size="12" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">Savings unmeasured</text><text x="27" y="67" fill="#baadd0" font-size="11" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="400">No regular-answer baseline · A/B needs extra tokens</text></svg>